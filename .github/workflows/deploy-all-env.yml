name: Deploy All Environments

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod/all)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dev
        - staging
        - prod

env:
  IMAGE_NAME: rails-hello-world

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rails_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_labels: ${{ steps.meta.outputs.labels }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle install
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run database setup
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:create
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/rails_app_test
          REDIS_URL: redis://localhost:6379

      - name: Run tests
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/rails_app_test
          REDIS_URL: redis://localhost:6379

      - name: Run security checks
        run: |
          bundle exec brakeman --no-progress --format json --output brakeman-report.json
          bundle exec bundle-audit check --update

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: rails-hello-world
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

  deploy-infra-dev:
    runs-on: ubuntu-latest
    needs: test-and-build
    env:
      ENV_DIR: dev
    outputs:
      aks_cluster_name: ${{ steps.tf.outputs.aks_cluster_name }}
      aks_resource_group: ${{ steps.tf.outputs.aks_resource_group }}
      key_vault_name: ${{ steps.tf.outputs.key_vault_name }}
      acr_login_server: ${{ steps.tf.outputs.acr_login_server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure (Terraform)
        run: |
          cd terraform/environment/${{ env.ENV_DIR }}
          terraform init
          terraform apply -auto-approve
          echo "::set-output name=aks_cluster_name::$(terraform output -raw aks_cluster_name)"
          echo "::set-output name=aks_resource_group::$(terraform output -raw aks_resource_group)"
          echo "::set-output name=key_vault_name::$(terraform output -raw key_vault_name)"
          echo "::set-output name=acr_login_server::$(terraform output -raw acr_login_server)"
        id: tf

  build-and-push-image-dev:
    runs-on: ubuntu-latest
    needs: deploy-infra-dev
    env:
      REGISTRY: ${{ needs.deploy-infra-dev.outputs.acr_login_server }}
      IMAGE_NAME: rails-hello-world
    outputs:
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      image_labels: ${{ needs.test-and-build.outputs.image_labels }}
      image_tags: ${{ needs.test-and-build.outputs.image_tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.test-and-build.outputs.image_tags }}
          labels: ${{ needs.test-and-build.outputs.image_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app-dev:
    runs-on: ubuntu-latest
    needs: build-and-push-image-dev
    env:
      ENV_DIR: dev
      NAMESPACE: rails-hello-world-dev
      VALUES_FILE: helm/values-dev.yaml
      REGISTRY: ${{ needs.deploy-infra-dev.outputs.acr_login_server }}
      IMAGE_NAME: rails-hello-world
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ needs.deploy-infra-dev.outputs.aks_resource_group }} --name ${{ needs.deploy-infra-dev.outputs.aks_cluster_name }} --overwrite-existing

      - name: Fetch secrets from Key Vault
        id: kv
        run: |
          DB_URL=$(az keyvault secret show --vault-name ${{ needs.deploy-infra-dev.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-postgres-connection" --query value -o tsv)
          APPINSIGHTS_KEY=$(az keyvault secret show --vault-name ${{ needs.deploy-infra-dev.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-appinsights-key" --query value -o tsv)
          echo "::set-output name=db_url::$DB_URL"
          echo "::set-output name=appinsights_key::$APPINSIGHTS_KEY"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Deploy App (Helm)
        run: |
          helm upgrade --install rails-hello-world-${{ env.ENV_DIR }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.VALUES_FILE }} \
            --set rails.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set rails.image.tag=${{ needs.test-and-build.outputs.image_tag }} \
            --set rails.env.SECRET_KEY_BASE=${{ secrets.RAILS_SECRET_KEY_BASE }} \
            --set rails.env.DATABASE_URL="${{ steps.kv.outputs.db_url }}" \
            --set rails.env.APPINSIGHTS_INSTRUMENTATIONKEY="${{ steps.kv.outputs.appinsights_key }}" \
            --wait \
            --timeout 10m

  deploy-dev:
    runs-on: ubuntu-latest
    needs: deploy-app-dev
    env:
      ENV_DIR: dev
      NAMESPACE: rails-hello-world-dev
      VALUES_FILE: helm/values-dev.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure (Terraform)
        run: |
          cd terraform/environment/${{ env.ENV_DIR }}
          terraform init
          terraform apply -auto-approve
          echo "::set-output name=aks_cluster_name::$(terraform output -raw aks_cluster_name)"
          echo "::set-output name=aks_resource_group::$(terraform output -raw aks_resource_group)"
          echo "::set-output name=key_vault_name::$(terraform output -raw key_vault_name)"
          echo "::set-output name=acr_login_server::$(terraform output -raw acr_login_server)"
        id: tf

      - name: Set ACR registry env
        run: echo "REGISTRY=${{ steps.tf.outputs.acr_login_server }}" >> $GITHUB_ENV

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ steps.tf.outputs.aks_resource_group }} --name ${{ steps.tf.outputs.aks_cluster_name }} --overwrite-existing

      - name: Fetch secrets from Key Vault
        id: kv
        run: |
          DB_URL=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-postgres-connection" --query value -o tsv)
          APPINSIGHTS_KEY=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-appinsights-key" --query value -o tsv)
          echo "::set-output name=db_url::$DB_URL"
          echo "::set-output name=appinsights_key::$APPINSIGHTS_KEY"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Deploy App (Helm)
        run: |
          helm upgrade --install rails-hello-world-${{ env.ENV_DIR }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.VALUES_FILE }} \
            --set rails.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set rails.image.tag=${{ needs.test-and-build.outputs.image_tag }} \
            --set rails.env.SECRET_KEY_BASE=${{ secrets.RAILS_SECRET_KEY_BASE }} \
            --set rails.env.DATABASE_URL="${{ steps.kv.outputs.db_url }}" \
            --set rails.env.APPINSIGHTS_INSTRUMENTATIONKEY="${{ steps.kv.outputs.appinsights_key }}" \
            --wait \
            --timeout 10m

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev
    env:
      ENV_DIR: staging
      NAMESPACE: rails-hello-world-staging
      VALUES_FILE: helm/values-staging.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure (Terraform)
        run: |
          cd terraform/environment/${{ env.ENV_DIR }}
          terraform init
          terraform apply -auto-approve
          echo "::set-output name=aks_cluster_name::$(terraform output -raw aks_cluster_name)"
          echo "::set-output name=aks_resource_group::$(terraform output -raw aks_resource_group)"
          echo "::set-output name=key_vault_name::$(terraform output -raw key_vault_name)"
          echo "::set-output name=acr_login_server::$(terraform output -raw acr_login_server)"
        id: tf

      - name: Set ACR registry env
        run: echo "REGISTRY=${{ steps.tf.outputs.acr_login_server }}" >> $GITHUB_ENV

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ steps.tf.outputs.aks_resource_group }} --name ${{ steps.tf.outputs.aks_cluster_name }} --overwrite-existing

      - name: Fetch secrets from Key Vault
        id: kv
        run: |
          DB_URL=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-postgres-connection" --query value -o tsv)
          APPINSIGHTS_KEY=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-appinsights-key" --query value -o tsv)
          echo "::set-output name=db_url::$DB_URL"
          echo "::set-output name=appinsights_key::$APPINSIGHTS_KEY"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Deploy App (Helm)
        run: |
          helm upgrade --install rails-hello-world-${{ env.ENV_DIR }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.VALUES_FILE }} \
            --set rails.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set rails.image.tag=${{ needs.test-and-build.outputs.image_tag }} \
            --set rails.env.SECRET_KEY_BASE=${{ secrets.RAILS_SECRET_KEY_BASE }} \
            --set rails.env.DATABASE_URL="${{ steps.kv.outputs.db_url }}" \
            --set rails.env.APPINSIGHTS_INSTRUMENTATIONKEY="${{ steps.kv.outputs.appinsights_key }}" \
            --wait \
            --timeout 10m

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    env:
      ENV_DIR: prod
      NAMESPACE: rails-hello-world-prod
      VALUES_FILE: helm/values-production.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure (Terraform)
        run: |
          cd terraform/environment/${{ env.ENV_DIR }}
          terraform init
          terraform apply -auto-approve
          echo "::set-output name=aks_cluster_name::$(terraform output -raw aks_cluster_name)"
          echo "::set-output name=aks_resource_group::$(terraform output -raw aks_resource_group)"
          echo "::set-output name=key_vault_name::$(terraform output -raw key_vault_name)"
          echo "::set-output name=acr_login_server::$(terraform output -raw acr_login_server)"
        id: tf

      - name: Set ACR registry env
        run: echo "REGISTRY=${{ steps.tf.outputs.acr_login_server }}" >> $GITHUB_ENV

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ steps.tf.outputs.aks_resource_group }} --name ${{ steps.tf.outputs.aks_cluster_name }} --overwrite-existing

      - name: Fetch secrets from Key Vault
        id: kv
        run: |
          DB_URL=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-postgres-connection" --query value -o tsv)
          APPINSIGHTS_KEY=$(az keyvault secret show --vault-name ${{ steps.tf.outputs.key_vault_name }} --name "${{ env.IMAGE_NAME }}-${{ env.ENV_DIR }}-appinsights-key" --query value -o tsv)
          echo "::set-output name=db_url::$DB_URL"
          echo "::set-output name=appinsights_key::$APPINSIGHTS_KEY"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Deploy App (Helm)
        run: |
          helm upgrade --install rails-hello-world-${{ env.ENV_DIR }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.VALUES_FILE }} \
            --set rails.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set rails.image.tag=${{ needs.test-and-build.outputs.image_tag }} \
            --set rails.env.SECRET_KEY_BASE=${{ secrets.RAILS_SECRET_KEY_BASE }} \
            --set rails.env.DATABASE_URL="${{ steps.kv.outputs.db_url }}" \
            --set rails.env.APPINSIGHTS_INSTRUMENTATIONKEY="${{ steps.kv.outputs.appinsights_key }}" \
            --wait \
            --timeout 10m

  notify-deployment:
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "✅ Dev, Staging, and Prod deployment complete!"