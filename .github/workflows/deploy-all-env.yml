permissions:
  contents: read
  id-token: write

name: Deploy All Environments

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod/all)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dev
        - staging
        - prod

env:
  IMAGE_NAME: rails-hello-world

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rails_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_labels: ${{ steps.meta.outputs.labels }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install dependencies
        run: |
          bundle install
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run database setup
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:create
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/rails_app_test
          REDIS_URL: redis://localhost:6379
      - name: Run tests
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/rails_app_test
          REDIS_URL: redis://localhost:6379
      - name: Run security checks
        run: |
          bundle exec brakeman --no-progress --format json --output brakeman-report.json
          bundle exec bundle-audit check --update
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: rails-hello-world
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

  # Deploy Dev Stage
  deploy-dev-infra:
    needs: test-and-build
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-dev-build-push:
    needs: deploy-dev-infra
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.deploy-dev-infra.outputs.acr_login_server }}
      IMAGE_NAME: rails-hello-world
    outputs:
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      image_labels: ${{ needs.test-and-build.outputs.image_labels }}
      image_tags: ${{ needs.test-and-build.outputs.image_tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.test-and-build.outputs.image_tags }}
          labels: ${{ needs.test-and-build.outputs.image_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev-app:
    needs: deploy-dev-build-push
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: dev
      namespace: rails-hello-world-dev
      values_file: helm/values-dev.yaml
      aks_resource_group: ${{ needs.deploy-dev-infra.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-dev-infra.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-dev-infra.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  # Deploy Staging Stage
  deploy-staging-infra:
    needs: test-and-build
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-staging-build-push:
    needs: deploy-staging-infra
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.deploy-staging-infra.outputs.acr_login_server }}
      IMAGE_NAME: rails-hello-world
    outputs:
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      image_labels: ${{ needs.test-and-build.outputs.image_labels }}
      image_tags: ${{ needs.test-and-build.outputs.image_tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.test-and-build.outputs.image_tags }}
          labels: ${{ needs.test-and-build.outputs.image_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging-app:
    needs: deploy-staging-build-push
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: staging
      namespace: rails-hello-world-staging
      values_file: helm/values-staging.yaml
      aks_resource_group: ${{ needs.deploy-staging-infra.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-staging-infra.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-staging-infra.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  # Deploy Prod Stage
  deploy-prod-infra:
    needs: test-and-build
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-prod-build-push:
    needs: deploy-prod-infra
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.deploy-prod-infra.outputs.acr_login_server }}
      IMAGE_NAME: rails-hello-world
    outputs:
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      image_labels: ${{ needs.test-and-build.outputs.image_labels }}
      image_tags: ${{ needs.test-and-build.outputs.image_tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.test-and-build.outputs.image_tags }}
          labels: ${{ needs.test-and-build.outputs.image_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod-app:
    needs: deploy-prod-build-push
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: prod
      namespace: rails-hello-world-prod
      values_file: helm/values-production.yaml
      aks_resource_group: ${{ needs.deploy-prod-infra.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-prod-infra.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-prod-infra.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  notify-deployment:
    runs-on: ubuntu-latest
    needs: deploy-prod-app
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "✅ Dev, Staging, and Prod deployment complete!"