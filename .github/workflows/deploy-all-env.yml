name: Deploy All Environments

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/staging/prod/all)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dev
        - staging
        - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle install
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start PostgreSQL and Redis
        run: |
          docker-compose up -d postgres redis
          sleep 10

      - name: Run database setup
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:create
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails db:migrate

      - name: Run tests
        run: |
          SECRET_KEY_BASE=$(bin/rails secret) bin/rails test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/rails_app_test
          REDIS_URL: redis://localhost:6379

      - name: Run security checks
        run: |
          bundle exec brakeman --no-progress --output-format json --output brakeman-report.json
          bundle exec bundle-audit check --update

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infra-dev:
    needs: test-and-build
    if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all' || github.event_name == 'push'
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-app-dev:
    needs: [test-and-build, deploy-infra-dev]
    if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all' || github.event_name == 'push'
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: dev
      namespace: rails-hello-world-dev
      values_file: helm/values-dev.yaml
      aks_resource_group: ${{ needs.deploy-infra-dev.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-infra-dev.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-infra-dev.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  deploy-infra-staging:
    needs: test-and-build
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'all'
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-app-staging:
    needs: [test-and-build, deploy-infra-staging, deploy-app-dev]
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'all'
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: staging
      namespace: rails-hello-world-staging
      values_file: helm/values-staging.yaml
      aks_resource_group: ${{ needs.deploy-infra-staging.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-infra-staging.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-infra-staging.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  deploy-infra-prod:
    needs: test-and-build
    if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-app-prod:
    needs: [test-and-build, deploy-infra-prod, deploy-app-staging]
    if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
    environment: production
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: prod
      namespace: rails-hello-world-prod
      values_file: helm/values-production.yaml
      aks_resource_group: ${{ needs.deploy-infra-prod.outputs.aks_resource_group }}
      aks_cluster_name: ${{ needs.deploy-infra-prod.outputs.aks_cluster_name }}
      image_tag: ${{ needs.test-and-build.outputs.image_tag }}
      key_vault_name: ${{ needs.deploy-infra-prod.outputs.key_vault_name }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      RAILS_SECRET_KEY_BASE: ${{ secrets.RAILS_SECRET_KEY_BASE }}

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-app-dev, deploy-app-staging, deploy-app-prod]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          
          if [ "${{ needs.deploy-app-dev.result }}" == "success" ]; then
            echo "✅ Development: Success"
            echo "   URL: https://dev.rails-hello-world.your-domain.com"
          else
            echo "❌ Development: Failed"
          fi
          
          if [ "${{ needs.deploy-app-staging.result }}" == "success" ]; then
            echo "✅ Staging: Success"
            echo "   URL: https://staging.rails-hello-world.your-domain.com"
          else
            echo "❌ Staging: Failed"
          fi
          
          if [ "${{ needs.deploy-app-prod.result }}" == "success" ]; then
            echo "✅ Production: Success"
            echo "   URL: https://rails-hello-world.your-domain.com"
          else
            echo "❌ Production: Failed"
          fi
          
          echo ""
          echo "🔧 Monitoring URLs:"
          echo "   Dev Grafana: https://dev.rails-hello-world.your-domain.com/grafana"
          echo "   Staging Grafana: https://staging.rails-hello-world.your-domain.com/grafana"
          echo "   Prod Grafana: https://rails-hello-world.your-domain.com/grafana"