name: Deploy All Environments

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  deploy-dev:
    name: Deploy Development
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: dev
    secrets: inherit

  deploy-staging:
    name: Deploy Staging
    needs: deploy-dev
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: staging
    secrets: inherit

  deploy-prod:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    needs: deploy-staging
    uses: ./.github/workflows/deploy-infra.yml
    with:
      env_dir: prod
    secrets: inherit