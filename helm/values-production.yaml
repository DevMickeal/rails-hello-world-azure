# Production environment values for rails-hello-world
# Override base values for production deployment

global:
  environment: production
  domain: your-domain.com

rails:
  replicaCount: 3
  image:
    repository: ghcr.io/your-org/rails-hello-world
    tag: latest
  env:
    RAILS_ENV: production
    DATABASE_URL: "postgresql://postgres:password@production-postgres-server:5432/rails_app_production"
    REDIS_URL: "redis://rails-hello-world-redis:6379"
  service:
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: rails-hello-world.your-domain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: rails-hello-world-tls
        hosts:
          - rails-hello-world.your-domain.com
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

prometheus:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

grafana:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  adminPassword: "production-admin-456"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

postgresql:
  azure:
    enabled: true
    serverName: "production-postgres-server"
    databaseName: "rails_app_production"
    username: "postgres"
    passwordSecretName: "production-postgres-password"
    passwordSecretKey: "password" 