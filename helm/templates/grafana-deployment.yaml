{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rails-hello-world.fullname" . }}-grafana
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      {{- include "rails-hello-world.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "rails-hello-world.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: {{ .Chart.Name }}-grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: {{ include "rails-hello-world.fullname" . }}-grafana
        - name: grafana-datasources
          configMap:
            name: {{ include "rails-hello-world.fullname" . }}-grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: {{ include "rails-hello-world.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rails-hello-world.fullname" . }}-grafana-datasources
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://{{ include "rails-hello-world.fullname" . }}-prometheus:9090
        access: proxy
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rails-hello-world.fullname" . }}-grafana-dashboards
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rails-hello-world.fullname" . }}-grafana
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
{{- end }} 