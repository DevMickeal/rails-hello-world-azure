{{- if .Values.rails.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rails-hello-world.serviceAccountName" . }}
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
  {{- with .Values.rails.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }} 