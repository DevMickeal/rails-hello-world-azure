{{- if .Values.rails.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rails-hello-world.fullname" . }}-rails
  labels:
    {{- include "rails-hello-world.labels" . | nindent 4 }}
    app.kubernetes.io/component: rails-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rails-hello-world.fullname" . }}-rails
  minReplicas: {{ .Values.rails.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.rails.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.rails.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.rails.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.rails.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.rails.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }} 